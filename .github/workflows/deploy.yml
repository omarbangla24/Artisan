name: Deploy to cPanel

# main branch-এ push করলেই এই workflow চলবে
on:
  push:
    branches: [main]
  workflow_dispatch:        # চাইলে GitHub UI থেকে ম্যানুয়ালি চালানো যাবে

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps        # cPanel সাধারণত explicit FTPS চায়; না চললে ftp করে দিন
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            src/**
            build.py
            README.md
            Archive.zip
            .rsyncignore
            **/.DS_Store
            # Live secrets & server-generated files — never touch on deploy
            admin/config.php
            assets/inc/**
