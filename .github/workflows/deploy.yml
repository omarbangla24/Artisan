name: Deploy to cPanel

# main branch-এ push করলেই এই workflow চলবে
on:
  push:
    branches: [main]
  workflow_dispatch:        # চাইলে GitHub UI থেকে ম্যানুয়ালি চালানো যাবে

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build site
        run: python3 build.py

      - name: Deploy via rsync over SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude-from='.rsyncignore' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:public_html/"
